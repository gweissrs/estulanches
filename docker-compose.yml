# EstuLanches - orquestração dos containers
# Uso:  docker compose up -d --build
# As credenciais vêm do arquivo .env (não versionado). Veja .env.example.

name: estulanches

services:
  # ---------------- Banco de dados ----------------
  db:
    image: postgres:17-alpine
    container_name: estulanches-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-estulanches}
      TZ: America/Sao_Paulo
    volumes:
      - pgdata:/var/lib/postgresql/data # volume persistente
    networks:
      - estulanches-net
    # Sem "ports": o banco só é acessível pela rede interna do Docker.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------- Aplicação (API + frontend) ----------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: estulanches-app:${APP_VERSION:-1.0.0}
    container_name: estulanches-app
    restart: unless-stopped
    init: true # processo init leve para repassar sinais (SIGTERM) ao Node
    depends_on:
      db:
        condition: service_healthy # só inicia após o pg_isready responder
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: America/Sao_Paulo
      # O backend acessa o banco pelo NOME DO SERVIÇO ("db"), não por localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-estulanches}?schema=public
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-10}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PUBLIC_DIR: /app/public
    ports:
      - "${APP_PORT:-3000}:3000"
    networks:
      - estulanches-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------- Banco de TESTES (opcional) ----------------
  # Isolado do banco de produção: outro container, outro banco, dados em memória (tmpfs).
  # Uso: docker compose --profile test up -d db-test
  db-test:
    image: postgres:17-alpine
    container_name: estulanches-db-test
    profiles: ["test"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: estulanches_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - estulanches-test-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d estulanches_test"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
    name: estulanches_pgdata

networks:
  estulanches-net:
    name: estulanches-net
    driver: bridge
  estulanches-test-net:
    name: estulanches-test-net
    driver: bridge
